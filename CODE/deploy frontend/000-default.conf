# Configuración personalizada para servir Angular como SPA
# Este archivo es incluido desde httpd.conf original

DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Redirige rutas no encontradas a Angular (SPA)
ErrorDocument 404 /index.html
