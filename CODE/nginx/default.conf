# Proxy único en http://localhost
# - "/" sirve el frontend (contenedor "frontend" con Apache)
# - "/api" enruta al backend Nest (contenedor "backend":3000)

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:3000;
}

server {
  listen 80;
  server_name _;

  # --- FRONTEND (Angular) ---
  location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- BACKEND (NestJS) ---
  # Si tus endpoints no tienen prefijo /api, cambia el bloque a "/" y ajusta el del front.
  location /api/ {
    proxy_pass http://backend_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
